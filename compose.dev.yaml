# Development overrides: hot reload for API, worker and the Vite frontend.
services:
  db:
    ports:
      - "5432:5432"

  migrate:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    image: openqz-api:dev
    volumes:
      - ./backend:/app
      - media:/data/media

  api:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    image: openqz-api:dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      # Dev email goes to Mailpit: open http://localhost:8025 to read it.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      SMTP_SSL: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
    volumes:
      - ./backend:/app
      - media:/data/media
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    image: openqz-api:dev
    command: ["arq", "--watch", "/app/app", "app.worker.tasks.WorkerSettings"]
    environment:
      # Dev email goes to Mailpit: open http://localhost:8025 to read it.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      SMTP_SSL: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
    volumes:
      - ./backend:/app
      - media:/data/media

  # Catches every email sent in development: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"

  vite:
    build:
      context: ./frontend
      target: dev
    image: openqz-web:dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
      # Hot reload must connect through the published nginx port.
      VITE_HMR_CLIENT_PORT: ${HTTP_PORT:-80}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  nginx:
    build: !reset null
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: !override
      api:
        condition: service_healthy
      vite:
        condition: service_healthy
