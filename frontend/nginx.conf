# Served from the web image. TLS is terminated in front of this (see deploy/nginx/prod.conf).
# Note: no add_header inside location blocks, so the security headers below are inherited everywhere.
# Real client address. The TLS edge (the only hop that sees the client) sets X-Real-IP and
# overwrites anything the client sent; this nginx is reachable only from the edge in
# production. Without an edge (development), fall back to the connecting address.
map $http_x_real_ip $client_real_ip {
  ""      $remote_addr;
  default $http_x_real_ip;
}

# Per real client, not per proxy: 60/min fits a classroom sharing one Wi-Fi address.
limit_req_zone $client_real_ip zone=login:10m rate=60r/m;

server {
  listen 80;
  # Re-resolve container names so a recreated api container never leaves nginx with a stale IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 12m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  # Google sign-in validates the page origin, so cross-origin requests must carry it.
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Isolate the window from other sites; the popup variant keeps Google sign-in working.
  add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location = /api/v1/auth/login {
    limit_req zone=login burst=30 nodelay;
    limit_req_status 429;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_set_header X-Forwarded-For $client_real_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_set_header X-Forwarded-For $client_real_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
