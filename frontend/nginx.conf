# Served from the web image. TLS is terminated in front of this (see deploy/nginx/prod.conf).
# Note: no add_header inside location blocks, so the security headers below are inherited everywhere.
# Real client address. This nginx is reachable only from the hop in front of it (127.0.0.1 in
# production), and that hop overwrites the header the client could have forged:
#   - Cloudflare tunnel (OSSC server): Cloudflare sets CF-Connecting-IP on every request;
#   - own TLS edge (deploy/edge): sets X-Real-IP and clears CF-Connecting-IP.
# Without either (development), fall back to the connecting address.
map $http_x_real_ip $edge_real_ip {
  ""      $remote_addr;
  default $http_x_real_ip;
}
map $http_cf_connecting_ip $client_real_ip {
  ""      $edge_real_ip;
  default $http_cf_connecting_ip;
}
# https when the hop in front ended TLS (Cloudflare and the edge both send X-Forwarded-Proto).
map $http_x_forwarded_proto $client_scheme {
  ""      $scheme;
  default $http_x_forwarded_proto;
}

# HSTS only when the visitor came over https (never on plain http in development).
map $client_scheme $hsts {
  https   "max-age=31536000; includeSubDomains";
  default "";
}

# Per real client, not per proxy. A whole college often shares one address (campus Wi-Fi) and
# signs in together before an exam, so this is generous; password guessing is stopped by the
# per-account lockout in the API.
limit_req_zone $client_real_ip zone=login:10m rate=300r/m;
# Password reset (request a link, use a link): slow on purpose.
limit_req_zone $client_real_ip zone=reset:10m rate=20r/m;

server {
  listen 80;
  # Re-resolve container names so a recreated api container never leaves nginx with a stale IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 12m;
  server_tokens off;

  # Compress the app files (the main bundle shrinks from about 430 kB to 140 kB). API responses are
  # left uncompressed on purpose: they carry tokens, and compressing secrets over TLS invites BREACH.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  # Google sign-in validates the page origin, so cross-origin requests must carry it.
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Camera: this site only, for scanning a join QR code on the sign-in page.
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  # Isolate the window from other sites; the popup variant keeps Google sign-in working.
  add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Strict-Transport-Security $hsts always;
  add_header X-Permitted-Cross-Domain-Policies none always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # For search engines: only the public pages; everything behind sign-in stays out.
  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /api/\nDisallow: /admin\nDisallow: /faculty\nDisallow: /student\nDisallow: /play\nDisallow: /join\nDisallow: /live\nDisallow: /account\nDisallow: /reset-password\nDisallow: /forgot-password\nDisallow: /change-password\n\nSitemap: $client_scheme://$http_host/sitemap.xml\n";
  }
  location = /sitemap.xml {
    default_type application/xml;
    return 200 '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n<url><loc>$client_scheme://$http_host/</loc><priority>1.0</priority></url>\n<url><loc>$client_scheme://$http_host/login</loc><priority>0.8</priority></url>\n<url><loc>$client_scheme://$http_host/guides/student.html</loc><priority>0.6</priority></url>\n<url><loc>$client_scheme://$http_host/guides/faculty.html</loc><priority>0.6</priority></url>\n<url><loc>$client_scheme://$http_host/guides/admin.html</loc><priority>0.5</priority></url>\n</urlset>\n';
  }
  # Where to report a security problem (RFC 9116). Renew "Expires" once a year.
  location = /.well-known/security.txt {
    default_type text/plain;
    return 200 "Contact: https://github.com/OSSC-DBIT/openqz/security/advisories/new\nContact: mailto:osscdbit@gmail.com\nExpires: 2027-11-01T00:00:00.000Z\nPreferred-Languages: en\nCanonical: $client_scheme://$http_host/.well-known/security.txt\nPolicy: https://github.com/OSSC-DBIT/openqz/blob/main/SECURITY.md\n";
  }
  location = /security.txt {
    return 301 /.well-known/security.txt;
  }
  # Dot files (.env, .git and the like) are never served, whatever ends up in the web root.
  location ~ /\.(?!well-known/) {
    return 404;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location = /api/v1/auth/login {
    gzip off;
    limit_req zone=login burst=100 nodelay;
    limit_req_status 429;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_set_header X-Forwarded-For $client_real_ip;
    proxy_set_header X-Forwarded-Proto $client_scheme;
  }

  location ~ ^/api/v1/auth/(forgot|reset)$ {
    gzip off;
    limit_req zone=reset burst=10 nodelay;
    limit_req_status 429;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_set_header X-Forwarded-For $client_real_ip;
    proxy_set_header X-Forwarded-Proto $client_scheme;
  }

  # The API reference is a development tool; it is not served here.
  location ~ ^/api/(docs|redoc|openapi\.json) {
    return 404;
  }

  location /api/ {
    gzip off;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_set_header X-Forwarded-For $client_real_ip;
    proxy_set_header X-Forwarded-Proto $client_scheme;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Mermaid for the guide pages: large, not content-hashed, changes only with a dependency bump.
  location /guides/vendor/ {
    expires 7d;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
