# Real client address. The TLS edge (the only hop that sees the client) sets X-Real-IP and
# overwrites anything the client sent; this nginx is reachable only from the edge in
# production. Without an edge (development), fall back to the connecting address.
map $http_x_real_ip $client_real_ip {
  ""      $remote_addr;
  default $http_x_real_ip;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  # Re-resolve container names so a recreated api container never leaves nginx with a stale IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;
  server_name _;
  client_max_body_size 12m;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_set_header X-Forwarded-For $client_real_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite dev server with HMR websocket
  location / {
    set $vite_upstream http://vite:5173;
    proxy_pass $vite_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }
}
