# TLS edge. Replace the domains if the IT cell assigns different ones.
#   openqz.dbit.co.in          -> production  (127.0.0.1:8081)
#   staging.openqz.dbit.co.in  -> staging     (127.0.0.1:8082)

server {
  listen 80;
  server_name openqz.dbit.co.in staging.openqz.dbit.co.in;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}

map $host $openqz_upstream {
  openqz.dbit.co.in         127.0.0.1:8081;
  staging.openqz.dbit.co.in 127.0.0.1:8082;
}

server {
  listen 443 ssl;
  http2 on;
  server_name openqz.dbit.co.in staging.openqz.dbit.co.in;

  ssl_certificate     /etc/letsencrypt/live/openqz.dbit.co.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/openqz.dbit.co.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 12m;
  server_tokens off;

  location / {
    proxy_pass http://$openqz_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Trust boundary: overwrite whatever the client sent.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }
}
