# Optional override: the mail server is reached on THIS machine (the Docker host).
# extra_hosts points SMTP_HOST at the host, so containers connect to the host's port
# SMTP_PORT, while TLS still checks the certificate against the real name.
#
# 1. Server with its own mail server (Postfix etc. on port 587), SMTP_PORT=587:
#      make prod-up LOCAL_MAIL=1
#    or: docker compose -f compose.yaml -f compose.prod.yaml -f compose.mail.yaml -p openqz-prod --env-file .env.prod up -d
#
# 2. Laptop through the Cloudflare tunnel, SMTP_PORT=1587:
#      cloudflared access tcp --hostname smtp-tunnel.webuildnow.in --url localhost:1587
#      docker compose -f compose.yaml -f compose.dev.yaml -f compose.mail.yaml up -d
#
# SMTP_HOST must be the mail server's real name (it must match its TLS certificate).
# See docs/email.md.

x-real-smtp: &real-smtp
  SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
  SMTP_PORT: ${SMTP_PORT:-1587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMTP_SSL: ${SMTP_SSL:-false}

services:
  api:
    environment: *real-smtp
    extra_hosts:
      - "${SMTP_HOST}:host-gateway"

  worker:
    environment: *real-smtp
    extra_hosts:
      - "${SMTP_HOST}:host-gateway"
